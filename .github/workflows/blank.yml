name: Build MyFitFlow APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Extract MyFitFlow project
        run: |
          unzip -q MyFitFlow-Cloud-Build.zip
          mv MyFitFlow-Android-Project android-project

      - name: Set Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/build-tools/35.0.0:$PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build MyFitFlow
        working-directory: android-project
        run: gradle assembleDebug --no-daemon

      - name: Upload MyFitFlow APK
        uses: actions/upload-artifact@v4
        with:
          name: MyFitFlow-APK
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
